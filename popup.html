<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Mova Flow Meet Recorder</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <img src="icons/32x32.png" width="18" height="18" alt="">
    <span>MOVA FLOW</span>
  </header>

  <main id="app">
    <div id="statusArea"></div>

    <details id="settingsDetails">
      <summary>Server settings</summary>
      <div class="field-row">
        <div>
          <label for="hostInput">Host</label>
          <input type="text" id="hostInput" placeholder="127.0.0.1">
        </div>
        <div style="flex: 0 0 80px;">
          <label for="portInput">Port</label>
          <input type="number" id="portInput" placeholder="5000">
        </div>
      </div>
      <label for="secretInput">Secret key</label>
      <input type="password" id="secretInput" placeholder="secret key">
      <div class="actions">
        <button class="action" id="saveSettingsBtn">Save</button>
        <button class="action secondary" id="testConnectionBtn">Test connection</button>
      </div>
      <div class="hint" id="settingsResult"></div>
    </details>
  </main>

  <script src="dist/popup.js"></script>
</body>
</html>
